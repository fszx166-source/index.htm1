
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX USER SCANNER</title>
<style>
body {
  background: #050505;
  color: #00ff66;
  font-family: monospace;
  padding: 20px;
}
h2 { text-align: center; }
button, select {
  box-sizing: border-box;
  background: #111;
  color: #00ff66;
  border: 1px solid #00ff66;
  padding: 12px;
  margin: 6px 0;
  width: 100%;
  font-size: 16px;
}
#log {
  border: 1px solid #00ff66;
  padding: 12px;
  height: 300px;
  overflow-y: auto;
  overflow-wrap: anywhere;
}
.small { color: #999; font-size: 12px; }
.ok { color: #00ff66; }
.err { color: #ff4444; }
</style>
</head>
<body>
<h2>FX USER SCANNER</h2>
<p>USERNAME GENERATOR</p>

<label for="length">Username length:</label>
<select id="length">
  <option value="3">3 characters</option>
  <option value="4" selected>4 characters</option>
</select>

<button id="start">START GENERATING</button>
<button id="stop">STOP</button>

<p class="small">
Generates username ideas only. TikTok availability is not verified.
</p>
<div id="log">System ready...</div>

<script>
let running = false;
let timer = null;
let count = 0;

const chars = "abcdefghijklmnopqrstuvwxyz0123456789_.";
const log = document.getElementById("log");

function makeName(length) {
  let name = "";
  for (let i = 0; i < length; i++) {
    name += chars[Math.floor(Math.random() * chars.length)];
  }
  return name;
}

function addLine(message, type = "") {
  const line = document.createElement("div");
  line.className = type;
  line.textContent = message;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function stop(showMessage = true) {
  running = false;
  if (timer !== null) {
    clearTimeout(timer);
    timer = null;
  }
  if (showMessage) addLine("Generation stopped.");
}

function generate() {
  if (!running) return;

  if (count >= 100) {
    stop(false);
    addLine("Generation completed: 100 usernames.", "ok");
    return;
  }

  const length = Number(document.getElementById("length").value);
  const username = makeName(length);

  addLine("@"+username+" — GENERATED OK", "ok");
  count++;
  timer = setTimeout(generate, 150);
}

document.getElementById("start").addEventListener("click", () => {
  stop(false);
  log.textContent = "";
  count = 0;
  running = true;
  addLine("Generating usernames...");
  generate();
});

document.getElementById("stop").addEventListener("click", () => {
  stop();
});
</script>
</body>
</html>
