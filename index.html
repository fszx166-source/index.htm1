<h1>كلام ابليس😖</h1>

<p>
“لا تختبر صبري، لأنك ما راح تعجبك النتيجة.”<br>
“اعتبرها آخر مرة أتجاوز فيها عن الموضوع.”<br>
“وقف عند حدك، ولا تضطرني أتصرف بطريقة ما تعجبك.”<br>
“أنا ساكت احترامًا، فلا تخليني أغيّر أسلوبي معك.”
</p>
